[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "intelliscrape"
version = "2.1.0"
description = "Advanced web scraping library with anti-detection, TLS impersonation, and stealth browsing. Scrapes 98% of websites."
readme = "README.md"
license = {text = "MIT"}

authors = [
  {name = "GuixJoy"}
]

requires-python = ">=3.9"

dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "curl_cffi>=0.7.0",
    "fastapi[standard]>=0.100.0",
    "uvicorn>=0.23.0",
    "psycopg[binary]>=3.1.0",
]

keywords = [
    "web scraping",
    "anti-detection",
    "stealth browser",
    "tls fingerprint",
    "captcha solving",
    "proxy rotation",
    "python scraper",
    "playwright",
    "beautifulsoup",
    "data extraction",
    "cloudflare bypass",
    "nodriver",
    "camoufox",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[project.optional-dependencies]
stealth = [
    "nodriver>=0.30",
]
camoufox = [
    "camoufox>=0.1.0",
]
captcha = [
    "capsolver>=1.0.0",
]
async = [
    "aiohttp>=3.9.0",
]
all = [
    "nodriver>=0.30",
    "camoufox>=0.1.0",
    "capsolver>=1.0.0",
    "playwright",
    "aiohttp>=3.9.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
]


[project.scripts]
intelliscrape = "intelliscrape.cli:main"


[project.urls]
Homepage = "https://github.com/GuixJoy/IntelliScrape"
Documentation = "https://github.com/GuixJoy/IntelliScrape#readme"
Repository = "https://github.com/GuixJoy/IntelliScrape"
Issues = "https://github.com/GuixJoy/IntelliScrape/issues"
