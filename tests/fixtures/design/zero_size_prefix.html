  .container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 32px; font-weight: 700; color: #101418; margin: 0 0 8px; }
  p  { font-size: 16px; line-height: 1.6; color: #52606d; margin: 0 0 16px; }
  .btn { font-family: "Inter", sans-serif; font-size: 14px; font-weight: 600;
         color: #fff; background: #2864DC; padding: 12px 20px; border: 0; border-radius: 8px; }
  .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 12px;
          box-shadow: 0 4px 16px rgba(16,20,24,0.08); padding: 24px; margin-top: 24px; }
  .nav { display: flex; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #e4e7eb; }
  .nav a { font-size: 14px; color: #3e4c59; text-decoration: none; }
